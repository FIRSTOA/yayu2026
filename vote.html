<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>장기자랑 투표 · 2026 퍼스트전산 여름 야유회</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background: #f4efe6; }
    .vwrap { max-width: 560px; margin: 0 auto; padding: 22px 16px 48px; }
    /* ===== 투표 화면 (모바일 우선) ===== */
    .vhero { text-align: center; margin-bottom: 18px; position: relative; }
    .vhero h1 { font-size: 1.8rem; margin: 0 0 6px; color: var(--teal-deep); }
    .vhero p { margin: 0; color: var(--muted); font-weight: 700; }
    .admin-link { position: absolute; top: 0; right: 0; background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 10px; font-size: 0.8rem; font-family: inherit; font-weight: 700; cursor: pointer; }
    .lock-banner { display: none; background: #fdecea; border: 1px solid #f5b7b1; color: #c0392b; border-radius: 12px; padding: 14px 16px; font-weight: 800; text-align: center; margin-bottom: 16px; }
    .lock-banner.show { display: block; }
    .cfg-warn { display: none; background: #fff8e1; border: 1px solid #ffe082; color: #8a6d00; border-radius: 12px; padding: 12px 14px; font-weight: 700; text-align: center; margin-bottom: 16px; font-size: 0.9rem; }
    .cfg-warn.show { display: block; }
    .vgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .vbtn { background: #fff; border: 2px solid var(--teal); color: var(--teal-deep); border-radius: 16px; padding: 22px 12px; font-family: inherit; font-weight: 800; font-size: 1.15rem; cursor: pointer; line-height: 1.3; word-break: keep-all; min-height: 84px; }
    .vbtn:hover { background: var(--teal-wash); }
    .vbtn:active { transform: scale(0.98); }
    .vbtn:disabled { opacity: 0.45; cursor: default; border-color: var(--line); color: var(--muted); }
    .vfoot { text-align: center; color: var(--muted); font-size: 0.82rem; margin-top: 22px; }
    @media (max-width: 380px) { .vgrid { grid-template-columns: 1fr; } }

    /* ===== 관리자 결과 화면 ===== */
    #admin-screen { display: none; }
    #admin-screen.show { display: block; }
    .adm-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 10px; }
    .adm-top h1 { font-size: 1.5rem; margin: 0; color: var(--teal-deep); }
    .adm-total { color: var(--muted); font-weight: 800; margin: 0 0 16px; }
    .res-row { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #fff; border: 1px solid var(--line); margin-bottom: 8px; }
    .res-row.t1 { background: linear-gradient(90deg, #F5C542, #E8A317); color: #16202B; border: 0; }
    .res-row.t2 { background: linear-gradient(90deg, #cbd4dc, #9fb0bd); color: #16202B; border: 0; }
    .res-row.t3 { background: linear-gradient(90deg, #dcae7e, #c0824a); color: #fff; border: 0; }
    .res-rank { font-weight: 800; font-size: 1.2rem; text-align: center; }
    .res-mid { min-width: 0; }
    .res-name { font-weight: 800; font-size: 1.05rem; }
    .res-bar { height: 8px; border-radius: 999px; background: rgba(0,0,0,0.12); margin-top: 6px; overflow: hidden; }
    .res-bar > span { display: block; height: 100%; background: var(--teal); border-radius: 999px; }
    .res-row.t1 .res-bar > span, .res-row.t2 .res-bar > span, .res-row.t3 .res-bar > span { background: rgba(0,0,0,0.35); }
    .res-votes { font-weight: 800; font-size: 1.1rem; white-space: nowrap; }
    .adm-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .adm-actions button { flex: 1; min-width: 130px; height: 48px; border-radius: 10px; border: none; font-family: inherit; font-weight: 800; font-size: 1rem; cursor: pointer; }
    .btn-present { background: #16202B; color: #F5C542; }
    .btn-back { background: rgba(0,0,0,0.08); color: var(--ink); }
    .btn-reset { background: #fdecea; color: #c0392b; }

    /* ===== 발표 모드 (빔프로젝터) ===== */
    #present-screen { position: fixed; inset: 0; background: #16202B; color: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 9000; padding: 20px; }
    #present-screen.show { display: flex; }
    .pv-rank { font-size: clamp(28px, 6vw, 54px); font-weight: 800; color: #F5C542; margin-bottom: 18px; }
    .pv-drum { font-size: clamp(28px, 5vw, 46px); font-weight: 800; color: rgba(255,255,255,0.85); min-height: 1.4em; letter-spacing: 2px; }
    .pv-reveal { display: none; }
    .pv-reveal.show { display: block; animation: pvpop 0.4s ease; }
    @keyframes pvpop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .pv-name { font-size: clamp(58px, 12vw, 150px); font-weight: 800; color: #fff; line-height: 1.1; word-break: keep-all; }
    .pv-votes { font-size: clamp(24px, 4vw, 40px); font-weight: 800; color: #F5C542; margin-top: 10px; }
    .pv-action { margin-top: 40px; height: 64px; min-width: 260px; border-radius: 14px; border: none; background: #F5C542; color: #16202B; font-family: inherit; font-weight: 800; font-size: 1.3rem; cursor: pointer; }
    .pv-action:disabled { opacity: 0.5; cursor: default; }
    .pv-exit { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.1); color: #fff; border: none; border-radius: 8px; height: 40px; padding: 0 16px; font-family: inherit; font-weight: 700; cursor: pointer; }
    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 9500; display: none; }
    #confetti.show { display: block; }
  </style>
</head>
<body>
  <!-- ===== 투표 화면 ===== -->
  <div class="vwrap" id="vote-screen">
    <div class="vhero">
      <button class="admin-link" id="admin-btn">🔒 관리자</button>
      <h1>🎤 장기자랑 투표</h1>
      <p>가장 멋졌던 무대에 한 표! <span style="color:var(--coral-deep)">(기기당 1표)</span></p>
    </div>
    <div class="cfg-warn" id="cfg-warn">⚠️ 투표 시스템(Firebase) 설정 전이에요. 진행자에게 문의해 주세요.</div>
    <div class="lock-banner" id="lock-banner">✅ 투표 완료! 이 기기에서는 다시 투표할 수 없어요</div>
    <div class="vgrid" id="vgrid"></div>
    <p class="vfoot">한 번 투표하면 변경할 수 없어요 · 정정이 필요하면 진행자에게 말씀해 주세요</p>
  </div>

  <!-- ===== 관리자 결과 화면 ===== -->
  <div class="vwrap" id="admin-screen">
    <div class="adm-top">
      <h1>📊 투표 현황</h1>
      <span class="cap" style="color:var(--muted);font-weight:700">🔴 실시간</span>
    </div>
    <p class="adm-total" id="adm-total">총 0표</p>
    <div id="res-list"></div>
    <div class="adm-actions">
      <button class="btn-present" id="btn-present">🥁 발표 모드</button>
      <button class="btn-back" id="btn-back">← 투표 화면</button>
      <button class="btn-reset" id="btn-reset">투표 초기화</button>
    </div>
    <p class="vfoot">발표 모드는 3등 → 2등 → 1등 순으로 진행자가 하나씩 공개해요</p>
  </div>

  <!-- ===== 발표 모드 ===== -->
  <div id="present-screen">
    <button class="pv-exit" id="pv-exit">나가기</button>
    <div class="pv-rank" id="pv-rank"></div>
    <div class="pv-drum" id="pv-drum"></div>
    <div class="pv-reveal" id="pv-reveal">
      <div class="pv-name" id="pv-name"></div>
      <div class="pv-votes" id="pv-votes"></div>
    </div>
    <button class="pv-action" id="pv-action"></button>
  </div>
  <canvas id="confetti"></canvas>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script>
    /* ============================================================
       ① 참가자 명단 — 행사 당일 이름만 바꾸면 됩니다 (순서=투표 버튼 순서)
       ============================================================ */
    const PARTICIPANTS = [
      "1번 무대",
      "2번 무대",
      "3번 무대",
      "4번 무대",
      "5번 무대",
      "6번 무대",
    ];

    /* ② 관리자 비밀번호 */
    const ADMIN_PW = "1234";

    /* ③ Firebase 설정 — 콘솔에서 복사한 값을 그대로 붙여넣으세요 (아래 안내 참고) */
    const FIREBASE_CONFIG = {
      apiKey: "여기에_APIKEY",
      authDomain: "여기에.firebaseapp.com",
      databaseURL: "https://여기에-default-rtdb.firebasedatabase.app",
      projectId: "여기에_PROJECTID",
      storageBucket: "여기에.appspot.com",
      messagingSenderId: "여기에",
      appId: "여기에"
    };
    // ⚠️ 기기별 1표 방지는 localStorage 기반 — 시크릿모드/기기변경으로 우회 가능하지만 사내 행사용으로는 충분합니다.
    const VOTE_KEY = "talent_voted_2026";

    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    /* ---------- Firebase 초기화 (설정 전이면 안전하게 건너뜀) ---------- */
    let db = null, configured = false, results = [];
    function isConfigured() { return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL && !FIREBASE_CONFIG.apiKey.includes("여기에"); }
    if (isConfigured()) {
      try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database(); configured = true; }
      catch (e) { console.error("Firebase init 실패", e); }
    }
    if (!configured) $("cfg-warn").classList.add("show");

    /* ---------- 투표 화면 ---------- */
    const voted = () => !!localStorage.getItem(VOTE_KEY);
    function renderVoteButtons() {
      $("vgrid").innerHTML = PARTICIPANTS.map((n, i) =>
        `<button class="vbtn" data-i="${i}" ${voted() ? "disabled" : ""}>${esc(n)}</button>`).join("");
      $("vgrid").querySelectorAll("[data-i]").forEach(b => b.onclick = () => castVote(+b.dataset.i));
      if (voted()) $("lock-banner").classList.add("show");
    }
    function lockVoting() {
      localStorage.setItem(VOTE_KEY, "true");
      $("lock-banner").classList.add("show");
      $("vgrid").querySelectorAll("button").forEach(b => b.disabled = true);
    }
    function castVote(i) {
      if (voted()) { $("lock-banner").classList.add("show"); return; }
      if (!configured) { alert("아직 투표 시스템 설정(Firebase) 전이에요. 진행자에게 문의해 주세요."); return; }
      const btn = $("vgrid").querySelector(`[data-i="${i}"]`);
      if (btn) btn.disabled = true;
      // votes/{index} 를 원자적으로 +1 (이름 대신 인덱스 키 → 한글 이름의 특수문자 제약 회피)
      db.ref("votes/" + i).set(firebase.database.ServerValue.increment(1))
        .then(() => { lockVoting(); })
        .catch(() => { alert("투표 전송 실패 — 네트워크를 확인하고 다시 시도해 주세요."); if (btn) btn.disabled = false; });
    }

    /* ---------- 관리자 결과 (실시간) ---------- */
    function startResultsListener() {
      if (!configured) return;
      db.ref("votes").on("value", snap => {
        const data = snap.val() || {};
        results = PARTICIPANTS.map((name, i) => ({ name, votes: (data && data[i]) || 0 }));
        if ($("admin-screen").classList.contains("show")) renderResults();
      });
    }
    function renderResults() {
      const sorted = results.slice().sort((a, b) => b.votes - a.votes);
      const total = results.reduce((s, r) => s + r.votes, 0);
      const max = Math.max(1, ...sorted.map(r => r.votes));
      $("adm-total").textContent = `총 ${total}표`;
      $("res-list").innerHTML = sorted.map((r, i) => {
        const medal = ["🥇", "🥈", "🥉"][i] || (i + 1);
        const tcls = i < 3 ? ` t${i + 1}` : "";
        const pct = Math.round((r.votes / max) * 100);
        return `<div class="res-row${tcls}"><span class="res-rank">${medal}</span>
          <div class="res-mid"><div class="res-name">${esc(r.name)}</div><div class="res-bar"><span style="width:${pct}%"></span></div></div>
          <span class="res-votes">${r.votes}표</span></div>`;
      }).join("");
    }
    function openAdmin() {
      const pw = prompt("관리자 비밀번호를 입력하세요");
      if (pw === null) return;
      if (pw !== ADMIN_PW) { alert("비밀번호가 틀렸습니다."); return; }
      $("vote-screen").style.display = "none";
      $("admin-screen").classList.add("show");
      if (!configured) { $("res-list").innerHTML = '<p class="cap" style="color:var(--muted)">⚠️ Firebase 설정 후 결과가 표시됩니다.</p>'; return; }
      renderResults();
    }
    function closeAdmin() { $("admin-screen").classList.remove("show"); $("vote-screen").style.display = "block"; }
    function resetVotes() {
      if (!configured) { alert("Firebase 설정 후 사용 가능합니다."); return; }
      if (!confirm("모든 투표를 0으로 초기화할까요? (되돌릴 수 없음)")) return;
      db.ref("votes").remove().then(() => alert("초기화되었습니다."));
    }

    /* ---------- 🥁 발표 모드 ---------- */
    let audioCtx = null, order = [], step = 0, pvPhase = "ready";
    function ensureAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function drumSound() {
      ensureAudio(); const start = audioCtx.currentTime;
      for (let t = 0; t < 2.2; t += 0.07) {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "triangle"; o.frequency.value = 150 + Math.random() * 40;
        const at = start + t;
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(0.2, at + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.06);
        o.connect(g).connect(audioCtx.destination); o.start(at); o.stop(at + 0.07);
      }
    }
    function fanfare() {
      ensureAudio(); const notes = [523.25, 659.25, 783.99, 1046.5], start = audioCtx.currentTime;
      notes.forEach((f, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "sine"; o.frequency.value = f; const at = start + i * 0.13;
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(0.28, at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.55);
        o.connect(g).connect(audioCtx.destination); o.start(at); o.stop(at + 0.57);
      });
    }
    function confettiBurst() {
      const cv = $("confetti"); cv.classList.add("show");
      const ctx = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
      const colors = ["#F5C542", "#E8442A", "#3AA6B9", "#7FB77E", "#ffffff", "#FF8A76"];
      const parts = Array.from({ length: 200 }, () => ({
        x: innerWidth / 2, y: innerHeight / 3,
        vx: (Math.random() - 0.5) * 16, vy: Math.random() * -16 - 4,
        c: colors[Math.floor(Math.random() * colors.length)], r: 4 + Math.random() * 6,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.5
      }));
      let frames = 0;
      (function loop() {
        ctx.clearRect(0, 0, cv.width, cv.height);
        parts.forEach(p => { p.vy += 0.32; p.x += p.vx; p.y += p.vy; p.rot += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); });
        frames++;
        if (frames < 200) requestAnimationFrame(loop);
        else { ctx.clearRect(0, 0, cv.width, cv.height); cv.classList.remove("show"); }
      })();
    }
    function enterPresent() {
      if (!configured || !results.length) { alert("결과 데이터가 없습니다."); return; }
      ensureAudio();
      // 득표순 상위 3 → [3등, 2등, 1등] 순으로 공개
      order = results.slice().sort((a, b) => b.votes - a.votes).slice(0, 3).reverse();
      if (!order.length) { alert("투표 데이터가 없습니다."); return; }
      step = 0;
      $("present-screen").classList.add("show");
      renderStep();
    }
    function exitPresent() { $("present-screen").classList.remove("show"); $("pv-reveal").classList.remove("show"); }
    function renderStep() {
      const rankNo = order.length - step; // step0 → (예: 3등)
      pvPhase = "ready";
      $("pv-rank").textContent = ["🥇 1등 발표", "🥈 2등 발표", "🥉 3등 발표"][rankNo - 1] || (rankNo + "등 발표");
      $("pv-drum").textContent = "";
      $("pv-reveal").classList.remove("show");
      const btn = $("pv-action"); btn.disabled = false;
      btn.textContent = "🥁 " + rankNo + "등 공개!";
    }
    function doStep() {
      if (pvPhase === "ready") {
        pvPhase = "rolling";
        const btn = $("pv-action"); btn.disabled = true;
        const drumEl = $("pv-drum"); drumSound();
        let n = 0; const iv = setInterval(() => { n++; drumEl.textContent = "두구".repeat(n) + "..."; }, 300);
        setTimeout(() => {
          clearInterval(iv); drumEl.textContent = "";
          const entry = order[step], rankNo = order.length - step;
          $("pv-name").textContent = entry.name;
          $("pv-votes").textContent = entry.votes + "표";
          $("pv-reveal").classList.add("show");
          fanfare();
          if (rankNo === 1) confettiBurst();
          pvPhase = "revealed";
          btn.disabled = false;
          btn.textContent = (step < order.length - 1) ? "다음 발표 →" : "🎉 발표 완료";
        }, 2200);
      } else if (pvPhase === "revealed") {
        if (step < order.length - 1) { step++; renderStep(); }
        else exitPresent();
      }
    }

    /* ---------- 배선 ---------- */
    $("admin-btn").onclick = openAdmin;
    $("btn-back").onclick = closeAdmin;
    $("btn-reset").onclick = resetVotes;
    $("btn-present").onclick = enterPresent;
    $("pv-action").onclick = doStep;
    $("pv-exit").onclick = exitPresent;
    window.addEventListener("resize", () => { const cv = $("confetti"); if (cv.classList.contains("show")) { cv.width = innerWidth; cv.height = innerHeight; } });

    renderVoteButtons();
    startResultsListener();
  </script>
</body>
</html>
